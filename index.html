<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070914">
<title>Galactic Upg Tree : Remade</title>
<meta name="description" content="Galactic Upg Tree : Remade, a 2D upgrade tree incremental with six reset layers, new currencies in every layer and generated music.">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">
<canvas id="bg" aria-hidden="true"></canvas>
<div id="gate" hidden>
  <div class="card">
    <h2>Galactic Upg Tree : Remade</h2>
    <p class="dim small">Closed beta. Enter your key to play.</p>
    <input id="gateKey" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Beta key" aria-label="Beta key">
    <button id="gateBtn" class="go">Enter</button>
    <p id="gateMsg" class="small" role="alert"></p>
  </div>
</div>
<header>
  <div class="brand">Galactic Upg Tree <i>: Remade</i></div>
  <div class="big"><b id="dust">10</b> <small>Cosmic Dust</small></div>
  <div class="sub"><span id="rate">0</span> per second</div>
  <div id="chips"></div>
  <nav id="tabs" role="tablist" aria-label="Layers"></nav>
</header>
<main id="main"></main>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>
<script src="gate.js"></script>
</body>
</html>
